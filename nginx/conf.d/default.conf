# ─────────────────────────────────────────────────────────────────
# Nginx reverse proxy for DeepSeek Harness (dsh)
#
# dsh binds to 127.0.0.1:3080 (loopback only, by design — see official
# "Publish the Web UI behind a reverse proxy" guide). Both containers use
# network_mode: host, so nginx reaches dsh via 127.0.0.1:3080.
#
# Per the official proxy requirements:
#   • Preserve the browser-facing Host header (dsh's trust fence checks it)
#   • Forward WebSocket upgrades
#   • Do not rewrite paths (nginx serves at root, dsh answers origin-root)
# ─────────────────────────────────────────────────────────────────

upstream dsh_backend {
    server 127.0.0.1:3080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/dsh_access.log main;
    error_log  /var/log/nginx/dsh_error.log warn;

    location / {
        proxy_pass http://dsh_backend;

        # HTTP/1.1 + keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the browser-facing Host — dsh's trust fence requires it.
        # Do NOT rewrite Host to 127.0.0.1:3080.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (dsh uses WS for live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Streaming / SSE: disable buffering for real-time LLM output
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for long-running LLM inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
